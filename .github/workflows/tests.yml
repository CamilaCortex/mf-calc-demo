# CI que la fábrica pone en los repos que crea: corre ruff y pytest en cada push y PR.
# Es la última capa de verificación, ya fuera de tu máquina: el PR muestra si pasa.
name: tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest ruff
      - run: ruff check .
      - run: pytest -q
